<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Particle Control</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: Arial, sans-serif;
        }
        #webcam {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 180px;
            height: 135px;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            transform: scaleX(-1);
            z-index: 10;
            background-color: #111;
            transition: border-color 0.3s;
        }
        #error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            font-size: 16px;
            display: none;
            text-align: center;
            z-index: 100;
        }
        #gesture-guide {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #999;
            background: rgba(0,0,0,0.6);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.9;
            z-index: 10;
            border: 1px solid #333;
        }
        #gesture-guide b { color: #ffcc44; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="error-msg">⚠️ Kamera tidak terdeteksi atau izin akses kamera ditolak!<br>Mohon izinkan akses kamera pada browser Anda.</div>

    <video id="webcam" autoplay playsinline muted></video>


    <script>
        const PARTICLE_COUNT = 8000;
        let scene, camera, renderer, particles, geometry, particleMaterial;
        let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
        let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        let currentColors = new Float32Array(PARTICLE_COUNT * 3);
        let targetColors = new Float32Array(PARTICLE_COUNT * 3);

        let activeShapeIndex = 0;

        // ==================== BARU: state mode "ikut jari" ====================
        let fingertipTarget = new THREE.Vector3(0, 0, 0); // posisi ujung telunjuk di dunia 3D
        let fingertipSmooth = new THREE.Vector3(0, 0, 0); // versi smoothing biar gak geter
        let prevTipPos = new THREE.Vector3();             // posisi frame lalu (buat ekor)
        let tipVelocity = new THREE.Vector3();
        let fingerDir = new THREE.Vector3(0, 1, 0);       // arah tunjukan telunjuk
        let hasTipData = false;
        let followTime = 0;
        let followOffsets, followRand;
        // ======================================================================

        function getCloudPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 15;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 15;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 15;
            }
            return pos;
        }

        function getHeartPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * Math.PI - Math.PI / 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                let z = u * 2;
                pos[i * 3] = x * 0.3;
                pos[i * 3 + 1] = y * 0.3;
                pos[i * 3 + 2] = z * 0.3;
            }
            return pos;
        }

        function getUranusPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (i < PARTICLE_COUNT * 0.45) {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI;
                    const r = 2.5;
                    pos[i * 3] = r * Math.sin(v) * Math.cos(u);
                    pos[i * 3 + 1] = r * Math.sin(v) * Math.sin(u);
                    pos[i * 3 + 2] = r * Math.cos(v);
                } else {
                    const theta = Math.random() * Math.PI * 2;
                    const r = 3.8 + Math.random() * 2.8;
                    pos[i * 3] = r * Math.cos(theta);
                    pos[i * 3 + 1] = (Math.random() - 0.5) * 0.25;
                    pos[i * 3 + 2] = r * Math.sin(theta);
                }
            }
            return pos;
        }

        function getTextPositions() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 120;

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('I LOVE YOU', 300, 75);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const validPixels = [];

            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    const index = (y * canvas.width + x) * 4;
                    if (imgData.data[index] > 128) {
                        validPixels.push({
                            x: (x - canvas.width / 2) * 0.03,
                            y: -(y - canvas.height / 2) * 0.03
                        });
                    }
                }
            }

            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const pt = validPixels[i % validPixels.length];
                pos[i * 3] = pt.x + (Math.random() - 0.5) * 0.03;
                pos[i * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.03;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
            }
            return pos;
        }

        // ============ BARU: data partikel buat mode "ikut jari" ============
        function initFollowData() {
            followOffsets = new Float32Array(PARTICLE_COUNT * 3); // posisi acak dalam bola
            followRand = new Float32Array(PARTICLE_COUNT);        // pembagi swarm vs beam
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = Math.cbrt(Math.random()) * 0.55;
                followOffsets[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                followOffsets[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                followOffsets[i * 3 + 2] = r * Math.cos(phi);
                followRand[i] = Math.random();
            }
        }

        function getFollowColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const rnd = followRand[i];
                if (rnd >= 0.55) {
                    // partikel beam: putih keemasan terang
                    col[i * 3] = 1.0;
                    col[i * 3 + 1] = 0.95;
                    col[i * 3 + 2] = 0.75;
                } else {
                    // partikel swarm: gradasi putih panas (tengah) → oranye (tepi)
                    const ox = followOffsets[i * 3];
                    const oy = followOffsets[i * 3 + 1];
                    const oz = followOffsets[i * 3 + 2];
                    const r = Math.sqrt(ox * ox + oy * oy + oz * oz);
                    const t = Math.min(r / 0.55, 1);
                    col[i * 3]     = 1.0;
                    col[i * 3 + 1] = 0.95 - t * 0.6;
                    col[i * 3 + 2] = 0.7 - t * 0.65;
                }
            }
            return col;
        }
        // ====================================================================

        function getCloudColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.2 + Math.random() * 0.8;
                col[i * 3 + 1] = 0.2 + Math.random() * 0.8;
                col[i * 3 + 2] = 0.5 + Math.random() * 0.5;
            }
            return col;
        }

        function getHeartColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.9 + Math.random() * 0.1;
                col[i * 3 + 1] = 0.05 + Math.random() * 0.15;
                col[i * 3 + 2] = 0.1 + Math.random() * 0.25;
            }
            return col;
        }

        function getUranusColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (i < PARTICLE_COUNT * 0.45) {
                    col[i * 3] = 0.35 + Math.random() * 0.15;
                    col[i * 3 + 1] = 0.85 + Math.random() * 0.15;
                    col[i * 3 + 2] = 0.9 + Math.random() * 0.1;
                } else {
                    col[i * 3] = 0.25 + Math.random() * 0.15;
                    col[i * 3 + 1] = 0.75 + Math.random() * 0.2;
                    col[i * 3 + 2] = 0.85 + Math.random() * 0.15;
                }
            }
            return col;
        }

        function getTextColor() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.0;
                col[i * 3 + 1] = 1.0;
                col[i * 3 + 2] = 0.8;
            }
            return col;
        }

        initFollowData();

        const shapes = [
            getCloudPositions(),   // 0: awan
            getHeartPositions(),   // 1: hati
            null,                  // 2: mode ikut jari (posisi di-update tiap frame)
            getTextPositions(),    // 3: teks
            getUranusPositions()   // 4: uranus
        ];

        const shapeColors = [
            getCloudColors(),
            getHeartColors(),
            getFollowColors(),     // warna emas komet ✨
            getTextColor(),
            getUranusColors()
        ];

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            geometry = new THREE.BufferGeometry();
            const initialPos = shapes[0];
            const initialCol = shapeColors[0];

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                currentPositions[i] = initialPos[i];
                targetPositions[i] = initialPos[i];
                currentColors[i] = initialCol[i];
                targetColors[i] = initialCol[i];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(currentColors, 3));

            particleMaterial = new THREE.PointsMaterial({
                size: 0.06,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.85
            });

            particles = new THREE.Points(geometry, particleMaterial);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setShape(shapeIndex) {
            if (activeShapeIndex === shapeIndex) return;
            if (activeShapeIndex === 2) hasTipData = false; // reset kalau keluar dari mode follow
            activeShapeIndex = shapeIndex;

            const targetCol = shapeColors[shapeIndex];
            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                targetColors[i] = targetCol[i];
            }

            // posisi mode follow dihitung di animate(), bukan di sini
            if (shapeIndex !== 2) {
                const targetPos = shapes[shapeIndex];
                for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                    targetPositions[i] = targetPos[i];
                }
            }
        }

        // ===== BARU: ubah posisi landmark MediaPipe (0-1) jadi koordinat dunia 3D =====
        function updateFingertip(lm) {
            const tip = lm[8];  // ujung telunjuk
            const pip = lm[6];  // sendi telunjuk

            // ukuran area yang terlihat kamera di bidang z=0
            const visH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
            const visW = visH * camera.aspect;

            // x dibalik (0.5 - x) karena video di-mirror, y dibalik karena layar
            const raw = new THREE.Vector3(
                (0.5 - tip.x) * visW,
                (0.5 - tip.y) * visH,
                THREE.MathUtils.clamp(-tip.z * 8, -5, 5)  // maju/mundurin tangan = depth
            );

            if (!hasTipData) {
                fingertipSmooth.copy(raw);
                prevTipPos.copy(raw);
                hasTipData = true;
            }

            fingertipSmooth.lerp(raw, 0.45); // smoothing biar gak jitter
            fingertipTarget.copy(fingertipSmooth);

            // arah telunjuk (sendi → ujung), diproyeksikan ke bidang layar
            const dx = (pip.x - tip.x) * visW;
            const dy = (pip.y - tip.y) * visH;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len > 0.05) {
                fingerDir.lerp(new THREE.Vector3(dx / len, dy / len, 0), 0.3).normalize();
            }
        }
        // =============================================================================

        function animate() {
            requestAnimationFrame(animate);

            const positions = geometry.attributes.position.array;
            const colorsAttr = geometry.attributes.color.array;

            // ===== BARU: hitung target posisi pas mode "ikut jari" =====
            if (activeShapeIndex === 2) {
                followTime += 0.03;
                tipVelocity.copy(fingertipTarget).sub(prevTipPos);
                prevTipPos.copy(fingertipTarget);

                const cosT = Math.cos(followTime);
                const sinT = Math.sin(followTime);

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const ox = followOffsets[i * 3];
                    const oy = followOffsets[i * 3 + 1];
                    const oz = followOffsets[i * 3 + 2];
                    const rnd = followRand[i];

                    if (rnd < 0.55) {
                        // swarm: muter-muter ngelilingi ujung jari + ekor kalau gerak cepet
                        const rx = ox * cosT - oz * sinT;
                        const rz = ox * sinT + oz * cosT;
                        const tail = rnd * 4;
                        targetPositions[i * 3]     = fingertipTarget.x + rx - tipVelocity.x * tail;
                        targetPositions[i * 3 + 1] = fingertipTarget.y + oy - tipVelocity.y * tail;
                        targetPositions[i * 3 + 2] = fingertipTarget.z + rz - tipVelocity.z * tail;
                    } else {
                        // beam: ngalir ke arah yang ditunjuk telunjuk
                        const beamLen = (rnd - 0.55) / 0.45 * 3.5;
                        targetPositions[i * 3]     = fingertipTarget.x + fingerDir.x * beamLen + ox * 0.08;
                        targetPositions[i * 3 + 1] = fingertipTarget.y + fingerDir.y * beamLen + oy * 0.08;
                        targetPositions[i * 3 + 2] = fingertipTarget.z + oz * 0.08;
                    }
                }
            }
            // ============================================================

            // di mode follow partikel dipercepet biar ngejarnya responsif
            const lerpFactor = activeShapeIndex === 2 ? 0.18 : 0.1;

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                positions[i] += (targetPositions[i] - positions[i]) * lerpFactor;
                colorsAttr[i] += (targetColors[i] - colorsAttr[i]) * 0.1;
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            if (activeShapeIndex === 2 || activeShapeIndex === 3) {
                // mode follow & teks: rotasi dinolkan biar posisi jari akurat
                particles.rotation.x = THREE.MathUtils.lerp(particles.rotation.x, 0, 0.1);
                particles.rotation.y = THREE.MathUtils.lerp(particles.rotation.y, 0, 0.1);
                particles.rotation.z = THREE.MathUtils.lerp(particles.rotation.z, 0, 0.1);
            } else if (activeShapeIndex === 1) {
                particles.rotation.y += 0.01;
                particles.rotation.x = THREE.MathUtils.lerp(particles.rotation.x, 0, 0.1);
                particles.rotation.z = THREE.MathUtils.lerp(particles.rotation.z, 0, 0.1);
            } else if (activeShapeIndex === 4) {
                particles.rotation.y += 0.012;
                particles.rotation.x += 0.008;
                particles.rotation.z += 0.003;
            } else {
                particles.rotation.y += 0.005;
            }

            // partikel dibesarin dikit di mode follow biar lebih "magic"
            const targetSize = activeShapeIndex === 2 ? 0.1 : 0.06;
            particleMaterial.size += (targetSize - particleMaterial.size) * 0.1;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function distSq(a, b) {
            const dx = a.x - b.x, dy = a.y - b.y;
            return dx * dx + dy * dy;
        }

        function detectGesture(landmarks) {
            // BARU: deteksi jempol (ujung jempol lebih jauh dari telapak kelingking)
            const isThumbOpen = distSq(landmarks[4], landmarks[17]) > distSq(landmarks[3], landmarks[17]) * 1.15;

            const isIndexOpen = landmarks[8].y < landmarks[6].y;
            const isMiddleOpen = landmarks[12].y < landmarks[10].y;
            const isRingOpen = landmarks[16].y < landmarks[14].y;
            const isPinkyOpen = landmarks[20].y < landmarks[18].y;

            if (isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                return 3; // ✌️ teks
            }
            // BARU: telunjuk doang = mode ikut jari
            if (isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                return 2;
            }
            // BARU: jempol doang = uranus
            if (isThumbOpen && !isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                return 4;
            }
            if (!isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                return 1; // ✊ hati
            }
            if (isIndexOpen && isMiddleOpen && isRingOpen && isPinkyOpen) {
                return 0; // ✋ awan
            }

            return activeShapeIndex;
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                setShape(detectGesture(lm));

                // BARU: terus update posisi & arah telunjuk selama mode aktif
                if (activeShapeIndex === 2) {
                    updateFingertip(lm);
                }

                // bonus: border webcam ganti warna kalo mode aktif
                videoElement.style.borderColor = activeShapeIndex === 2 ? '#ffaa00' : '#00ffcc';
            }
        }

        const videoElement = document.getElementById('webcam');
        const errorMsg = document.getElementById('error-msg');

        initThreeJS();

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
                videoElement.srcObject = stream;
                const cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 480,
                    height: 360
                });
                cameraUtils.start();
            })
            .catch((err) => {
                console.error("Akses kamera ditolak/gagal:", err);
                errorMsg.style.display = "block";
            });
    </script>
</body>
</html>
