<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Particle Control</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: Arial, sans-serif;
        }
        #cam-wrap {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 320px;
            height: 240px;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            background-color: #111;
            transition: border-color 0.3s;
        }
        #webcam, #hand-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* video & skeleton sama-sama di-mirror */
        }
        #hand-canvas { pointer-events: none; }
        #track-status {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            color: #aaa;
            background: linear-gradient(rgba(0,0,0,0.75), transparent);
            z-index: 5;
        }
        #error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            font-size: 16px;
            display: none;
            text-align: center;
            z-index: 100;
        }
        #gesture-guide {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #999;
            background: rgba(0,0,0,0.6);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.9;
            z-index: 10;
            border: 1px solid #333;
        }
        #gesture-guide b { color: #ffcc44; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- drawing_utils GAK DIPAKE LAGI — skeleton digambar manual, lebih pasti jalan -->
</head>
<body>

    <div id="error-msg">⚠️ Kamera tidak terdeteksi atau izin akses kamera ditolak!<br>Mohon izinkan akses kamera pada browser Anda.</div>

    <div id="cam-wrap">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="hand-canvas" width="640" height="480"></canvas>
        <div id="track-status">⚪ MENCARI TANGAN...</div>
    </div>

    <script>
        const PARTICLE_COUNT = 8000;
        let scene, camera, renderer, particles, geometry, particleMaterial, tipMarker;
        let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
        let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        let currentColors = new Float32Array(PARTICLE_COUNT * 3);
        let targetColors = new Float32Array(PARTICLE_COUNT * 3);

        let activeShapeIndex = 0;

        const SHAPE_NAMES = ['AWAN ☁️', 'HATI ❤️', 'IKUT JARI ✨', 'TEKS 💬', 'URANUS 🪐'];

        // ==================== mode "ikut jari" ====================
        let fingertipTarget = new THREE.Vector3(0, 0, 0);
        let fingertipSmooth = new THREE.Vector3(0, 0, 0);
        let prevTipPos = new THREE.Vector3();
        let tipVelocity = new THREE.Vector3();
        let fingerDir = new THREE.Vector3(0, 1, 0);
        let hasTipData = false;
        let followTime = 0;
        let followOffsets, followRand;

        // ===== kontrol tangan: posisi (geser) + rotasi (miring) =====
        let handPosTarget = { x: 0, y: 0 };       // BARU: target posisi awan (translate)
        let handRotTarget = { x: 0, y: 0, z: 0 }; // target rotasi dari tracking
        let handRot = { x: 0, y: 0, z: 0 };
        let handInfluence = 0;      // 0 = tangan gak terdeteksi, 1 = terdeteksi
        let handInfluenceTarget = 0;
        let autoRot = { x: 0, y: 0, z: 0 };

        function getCloudPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 15;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 15;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 15;
            }
            return pos;
        }

        function getHeartPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * Math.PI - Math.PI / 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                let z = u * 2;
                pos[i * 3] = x * 0.3;
                pos[i * 3 + 1] = y * 0.3;
                pos[i * 3 + 2] = z * 0.3;
            }
            return pos;
        }

        function getUranusPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (i < PARTICLE_COUNT * 0.45) {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI;
                    const r = 2.5;
                    pos[i * 3] = r * Math.sin(v) * Math.cos(u);
                    pos[i * 3 + 1] = r * Math.sin(v) * Math.sin(u);
                    pos[i * 3 + 2] = r * Math.cos(v);
                } else {
                    const theta = Math.random() * Math.PI * 2;
                    const r = 3.8 + Math.random() * 2.8;
                    pos[i * 3] = r * Math.cos(theta);
                    pos[i * 3 + 1] = (Math.random() - 0.5) * 0.25;
                    pos[i * 3 + 2] = r * Math.sin(theta);
                }
            }
            return pos;
        }

        function getTextPositions() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 120;

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('I LOVE YOU', 300, 75);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const validPixels = [];

            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    const index = (y * canvas.width + x) * 4;
                    if (imgData.data[index] > 128) {
                        validPixels.push({
                            x: (x - canvas.width / 2) * 0.03,
                            y: -(y - canvas.height / 2) * 0.03
                        });
                    }
                }
            }

            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const pt = validPixels[i % validPixels.length];
                pos[i * 3] = pt.x + (Math.random() - 0.5) * 0.03;
                pos[i * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.03;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
            }
            return pos;
        }

        function initFollowData() {
            followOffsets = new Float32Array(PARTICLE_COUNT * 3);
            followRand = new Float32Array(PARTICLE_COUNT);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = Math.cbrt(Math.random()) * 0.55;
                followOffsets[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                followOffsets[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                followOffsets[i * 3 + 2] = r * Math.cos(phi);
                followRand[i] = Math.random();
            }
        }

        function getFollowColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const rnd = followRand[i];
                if (rnd >= 0.55) {
                    col[i * 3] = 1.0;
                    col[i * 3 + 1] = 0.95;
                    col[i * 3 + 2] = 0.75;
                } else {
                    const ox = followOffsets[i * 3];
                    const oy = followOffsets[i * 3 + 1];
                    const oz = followOffsets[i * 3 + 2];
                    const r = Math.sqrt(ox * ox + oy * oy + oz * oz);
                    const t = Math.min(r / 0.55, 1);
                    col[i * 3]     = 1.0;
                    col[i * 3 + 1] = 0.95 - t * 0.6;
                    col[i * 3 + 2] = 0.7 - t * 0.65;
                }
            }
            return col;
        }

        function getCloudColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.2 + Math.random() * 0.8;
                col[i * 3 + 1] = 0.2 + Math.random() * 0.8;
                col[i * 3 + 2] = 0.5 + Math.random() * 0.5;
            }
            return col;
        }

        function getHeartColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.9 + Math.random() * 0.1;
                col[i * 3 + 1] = 0.05 + Math.random() * 0.15;
                col[i * 3 + 2] = 0.1 + Math.random() * 0.25;
            }
            return col;
        }

        function getUranusColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (i < PARTICLE_COUNT * 0.45) {
                    col[i * 3] = 0.35 + Math.random() * 0.15;
                    col[i * 3 + 1] = 0.85 + Math.random() * 0.15;
                    col[i * 3 + 2] = 0.9 + Math.random() * 0.1;
                } else {
                    col[i * 3] = 0.25 + Math.random() * 0.15;
                    col[i * 3 + 1] = 0.75 + Math.random() * 0.2;
                    col[i * 3 + 2] = 0.85 + Math.random() * 0.15;
                }
            }
            return col;
        }

        function getTextColor() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.0;
                col[i * 3 + 1] = 1.0;
                col[i * 3 + 2] = 0.8;
            }
            return col;
        }

        initFollowData();

        const shapes = [
            getCloudPositions(),   // 0: awan
            getHeartPositions(),   // 1: hati
            null,                  // 2: mode ikut jari
            getTextPositions(),    // 3: teks
            getUranusPositions()   // 4: uranus
        ];

        const shapeColors = [
            getCloudColors(),
            getHeartColors(),
            getFollowColors(),
            getTextColor(),
            getUranusColors()
        ];

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            geometry = new THREE.BufferGeometry();
            const initialPos = shapes[0];
            const initialCol = shapeColors[0];

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                currentPositions[i] = initialPos[i];
                targetPositions[i] = initialPos[i];
                currentColors[i] = initialCol[i];
                targetColors[i] = initialCol[i];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(currentColors, 3));

            particleMaterial = new THREE.PointsMaterial({
                size: 0.06,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.85
            });

            particles = new THREE.Points(geometry, particleMaterial);
            scene.add(particles);

            tipMarker = new THREE.Mesh(
                new THREE.SphereGeometry(0.09, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.9 })
            );
            tipMarker.visible = false;
            scene.add(tipMarker);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setShape(shapeIndex) {
            if (activeShapeIndex === shapeIndex) return;
            if (activeShapeIndex === 2) hasTipData = false;
            activeShapeIndex = shapeIndex;

            const targetCol = shapeColors[shapeIndex];
            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                targetColors[i] = targetCol[i];
            }

            if (shapeIndex !== 2) {
                const targetPos = shapes[shapeIndex];
                for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                    targetPositions[i] = targetPos[i];
                }
            }
        }

        function updateFingertip(lm) {
            const tip = lm[8];
            const pip = lm[6];

            const visH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
            const visW = visH * camera.aspect;

            const raw = new THREE.Vector3(
                (0.5 - tip.x) * visW,
                (0.5 - tip.y) * visH,
                THREE.MathUtils.clamp(-tip.z * 8, -5, 5)
            );

            if (!hasTipData) {
                fingertipSmooth.copy(raw);
                prevTipPos.copy(raw);
                hasTipData = true;
            }

            fingertipSmooth.lerp(raw, 0.45);
            fingertipTarget.copy(fingertipSmooth);

            const dx = (pip.x - tip.x) * visW;
            const dy = (pip.y - tip.y) * visH;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len > 0.05) {
                fingerDir.lerp(new THREE.Vector3(dx / len, dy / len, 0), 0.3).normalize();
            }
        }

        // ==== BARU: tracking tangan → posisi (geser) + rotasi (miring) semua objek ====
        function updateHandControl(lm) {
            const visH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
            const visW = visH * camera.aspect;

            // --- POSISI: awan partikel ikut geser arah tangan ---
            // tangan naik → awan naik, turun → turun, kiri/kanan → ikut
            // (x dibalik karena video di-mirror)
            handPosTarget.x = (0.5 - lm[9].x) * visW * 0.55;
            handPosTarget.y = (0.5 - lm[9].y) * visH * 0.55;

            // --- ROTASI ---
            // geser kiri/kanan → objek muter (sumbu Y)
            handRotTarget.y = (0.5 - lm[9].x) * 1.6;

            // geser atas/bawah → objek ngangkuk/nunduk (sumbu X)
            handRotTarget.x = (lm[9].y - 0.5) * 1.2;

            // miringin telapak → objek ikut miring (sumbu Z)
            const dx = lm[9].x - lm[0].x;
            const dy = lm[9].y - lm[0].y;
            handRotTarget.z = Math.atan2(dx, -dy) * 0.9;

            handInfluenceTarget = 1;
        }
        // ================================================================================

        function animate() {
            requestAnimationFrame(animate);

            const positions = geometry.attributes.position.array;
            const colorsAttr = geometry.attributes.color.array;

            if (activeShapeIndex === 2) {
                followTime += 0.03;
                tipVelocity.copy(fingertipTarget).sub(prevTipPos);
                prevTipPos.copy(fingertipTarget);

                const cosT = Math.cos(followTime);
                const sinT = Math.sin(followTime);

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const ox = followOffsets[i * 3];
                    const oy = followOffsets[i * 3 + 1];
                    const oz = followOffsets[i * 3 + 2];
                    const rnd = followRand[i];

                    if (rnd < 0.55) {
                        const rx = ox * cosT - oz * sinT;
                        const rz = ox * sinT + oz * cosT;
                        const tail = rnd * 4;
                        targetPositions[i * 3]     = fingertipTarget.x + rx - tipVelocity.x * tail;
                        targetPositions[i * 3 + 1] = fingertipTarget.y + oy - tipVelocity.y * tail;
                        targetPositions[i * 3 + 2] = fingertipTarget.z + rz - tipVelocity.z * tail;
                    } else {
                        const beamLen = (rnd - 0.55) / 0.45 * 3.5;
                        targetPositions[i * 3]     = fingertipTarget.x + fingerDir.x * beamLen + ox * 0.08;
                        targetPositions[i * 3 + 1] = fingertipTarget.y + fingerDir.y * beamLen + oy * 0.08;
                        targetPositions[i * 3 + 2] = fingertipTarget.z + oz * 0.08;
                    }
                }
            }

            const lerpFactor = activeShapeIndex === 2 ? 0.18 : 0.1;

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                positions[i] += (targetPositions[i] - positions[i]) * lerpFactor;
                colorsAttr[i] += (targetColors[i] - colorsAttr[i]) * 0.1;
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            // ===== BARU: penerjemahan gerakan tangan ke objek =====
            handInfluence += (handInfluenceTarget - handInfluence) * 0.06;

            // geser posisi awan (translate) — di mode ikut jari tetap di tengah
            const tPX = activeShapeIndex === 2 ? 0 : handPosTarget.x * handInfluence;
            const tPY = activeShapeIndex === 2 ? 0 : handPosTarget.y * handInfluence;
            particles.position.x += (tPX - particles.position.x) * 0.1;
            particles.position.y += (tPY - particles.position.y) * 0.1;

            // rotasi
            handRot.x += (handRotTarget.x - handRot.x) * 0.08;
            handRot.y += (handRotTarget.y - handRot.y) * 0.08;
            handRot.z += (handRotTarget.z - handRot.z) * 0.08;

            const hx = handRot.x * handInfluence;
            const hy = handRot.y * handInfluence;
            const hz = handRot.z * handInfluence;

            let targetRX, targetRY, targetRZ;
            if (activeShapeIndex === 2) {
                targetRX = targetRY = targetRZ = 0;
            } else if (activeShapeIndex === 3) {
                targetRX = hx; targetRY = hy; targetRZ = hz;
            } else if (activeShapeIndex === 1) {
                autoRot.y += 0.01;
                targetRY = autoRot.y + hy; targetRX = hx; targetRZ = hz;
            } else if (activeShapeIndex === 4) {
                autoRot.y += 0.012; autoRot.x += 0.008; autoRot.z += 0.003;
                targetRY = autoRot.y + hy; targetRX = autoRot.x + hx; targetRZ = autoRot.z + hz;
            } else {
                autoRot.y += 0.005;
                targetRY = autoRot.y + hy; targetRX = hx; targetRZ = hz;
            }

            particles.rotation.x += (targetRX - particles.rotation.x) * 0.1;
            particles.rotation.y += (targetRY - particles.rotation.y) * 0.1;
            particles.rotation.z += (targetRZ - particles.rotation.z) * 0.1;

            // marker ujung telunjuk
            if (activeShapeIndex === 2 && hasTipData) {
                tipMarker.visible = true;
                tipMarker.position.copy(fingertipSmooth);
                tipMarker.scale.setScalar(1 + Math.sin(followTime * 3) * 0.25);
            } else {
                tipMarker.visible = false;
            }

            const targetSize = activeShapeIndex === 2 ? 0.1 : 0.06;
            particleMaterial.size += (targetSize - particleMaterial.size) * 0.1;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function distSq(a, b) {
            const dx = a.x - b.x, dy = a.y - b.y;
            return dx * dx + dy * dy;
        }

        // deteksi buka/tutup per jari → dipake buat gesture DAN warna skeleton
        function getFingerStates(lm) {
            const thumbOpen = distSq(lm[4], lm[17]) > distSq(lm[3], lm[17]) * 1.15;
            const indexOpen = lm[8].y < lm[6].y;
            const middleOpen = lm[12].y < lm[10].y;
            const ringOpen = lm[16].y < lm[14].y;
            const pinkyOpen = lm[20].y < lm[18].y;
            return [thumbOpen, indexOpen, middleOpen, ringOpen, pinkyOpen];
        }

        function detectGesture(lm) {
            const s = getFingerStates(lm); // [jempol, telunjuk, tengah, manis, kelingking]

            if (s[1] && s[2] && !s[3] && !s[4]) return 3;   // ✌️ teks
            if (s[1] && !s[2] && !s[3] && !s[4]) return 2;  // ☝️ ikut jari
            if (s[0] && !s[1] && !s[2] && !s[3] && !s[4]) return 4; // 👍 uranus
            if (!s[1] && !s[2] && !s[3] && !s[4]) return 1; // ✊ hati
            if (s[1] && s[2] && s[3] && s[4]) return 0;     // ✋ awan

            return activeShapeIndex;
        }

        // ==== BARU: gambar skeleton MANUAL pakai canvas 2D (gak butuh library tambahan) ====
        const HAND_LINKS = [
            [0,1],[1,2],[2,3],[3,4],           // jempol
            [0,5],[5,6],[6,7],[7,8],           // telunjuk
            [5,9],[9,10],[10,11],[11,12],      // tengah
            [9,13],[13,14],[14,15],[15,16],    // manis
            [13,17],[17,18],[18,19],[19,20],   // kelingking
            [0,17]                             // bawah telapak
        ];

        function drawSkeleton(lm) {
            const ctx = handCanvas.getContext('2d');
            ctx.clearRect(0, 0, handCanvas.width, handCanvas.height);
            if (!lm) return;

            const W = handCanvas.width, H = handCanvas.height;
            const states = getFingerStates(lm);
            const jointR = Math.max(2, W / 90);
            const tipR = Math.max(3, W / 50);

            // ---- garis tulang: ijo kalo jari kebuka, merah kalo ditekuk ----
            ctx.lineCap = 'round';
            ctx.lineWidth = Math.max(2, W / 150);
            for (let i = 0; i < HAND_LINKS.length; i++) {
                const a = HAND_LINKS[i][0], b = HAND_LINKS[i][1];

                let color = '#00ff66'; // tulang telapak selalu ijo
                if (b >= 1 && b <= 4)        color = states[0] ? '#00ff66' : '#ff4444';
                else if (b >= 5 && b <= 8)   color = states[1] ? '#00ff66' : '#ff4444';
                else if (b >= 9 && b <= 12)  color = states[2] ? '#00ff66' : '#ff4444';
                else if (b >= 13 && b <= 16) color = states[3] ? '#00ff66' : '#ff4444';
                else if (b >= 17 && b <= 20) color = states[4] ? '#00ff66' : '#ff4444';

                ctx.strokeStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(lm[a].x * W, lm[a].y * H);
                ctx.lineTo(lm[b].x * W, lm[b].y * H);
                ctx.stroke();
            }

            // ---- titik di setiap sendi ----
            for (let i = 0; i < 21; i++) {
                let color = '#00ff66';
                if (i >= 1 && i <= 4)        color = states[0] ? '#ccffdd' : '#ff9999';
                else if (i >= 5 && i <= 8)   color = states[1] ? '#ccffdd' : '#ff9999';
                else if (i >= 9 && i <= 12)  color = states[2] ? '#ccffdd' : '#ff9999';
                else if (i >= 13 && i <= 16) color = states[3] ? '#ccffdd' : '#ff9999';
                else if (i >= 17 && i <= 20) color = states[4] ? '#ccffdd' : '#ff9999';

                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 4;
                ctx.beginPath();
                ctx.arc(lm[i].x * W, lm[i].y * H, jointR, 0, Math.PI * 2);
                ctx.fill();
            }

            // ---- ujung jari lebih gede: kuning = kebuka, merah = ditekuk ----
            const tips = [4, 8, 12, 16, 20];
            for (let f = 0; f < tips.length; f++) {
                const color = states[f] ? '#ffff44' : '#ff2222';
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(lm[tips[f]].x * W, lm[tips[f]].y * H, tipR, 0, Math.PI * 2);
                ctx.fill();
            }

            // ---- crosshair di titik kontrol (tengah telapak) ----
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffcc44';
            ctx.lineWidth = 2;
            const cx = lm[9].x * W, cy = lm[9].y * H, cr = W / 30;
            ctx.beginPath();
            ctx.arc(cx, cy, cr, 0, Math.PI * 2);
            ctx.moveTo(cx - cr * 1.6, cy); ctx.lineTo(cx + cr * 1.6, cy);
            ctx.moveTo(cx, cy - cr * 1.6); ctx.lineTo(cx, cy + cr * 1.6);
            ctx.stroke();
        }
        // ================================================================================

        function onResults(results) {
            // samain resolusi canvas sama frame kamera asli biar skeleton presisi nempel
            if (results.image) {
                if (handCanvas.width !== results.image.width) handCanvas.width = results.image.width;
                if (handCanvas.height !== results.image.height) handCanvas.height = results.image.height;
            }

            const hasHand = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
            drawSkeleton(hasHand ? results.multiHandLandmarks[0] : null);

            if (hasHand) {
                const lm = results.multiHandLandmarks[0];
                setShape(detectGesture(lm));

                // posisi + rotasi objek ngikutin telapak tangan
                updateHandControl(lm);

                if (activeShapeIndex === 2) {
                    updateFingertip(lm);
                }

                trackStatus.textContent = '🟢 ' + SHAPE_NAMES[activeShapeIndex];
                trackStatus.style.color = '#00ff66';
                camWrap.style.borderColor = activeShapeIndex === 2 ? '#ffaa00' : '#00ffcc';
            } else {
                handInfluenceTarget = 0;
                trackStatus.textContent = '⚪ MENCARI TANGAN...';
                trackStatus.style.color = '#aaa';
                camWrap.style.borderColor = '#00ffcc';
            }
        }

        const videoElement = document.getElementById('webcam');
        const handCanvas = document.getElementById('hand-canvas');
        const trackStatus = document.getElementById('track-status');
        const camWrap = document.getElementById('cam-wrap');
        const errorMsg = document.getElementById('error-msg');

        initThreeJS();

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
                videoElement.srcObject = stream;
                const cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 640,
                    height: 480
                });
                cameraUtils.start();
            })
            .catch((err) => {
                console.error("Akses kamera ditolak/gagal:", err);
                errorMsg.style.display = "block";
            });
    </script>
</body>
</html>
