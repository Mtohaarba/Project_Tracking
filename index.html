<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hand Gesture Particle Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #webcam {
            position: fixed;
            bottom: 20px;
            left: 20px;

            width: 180px;
            height: 135px;

            object-fit: cover;

            border: 2px solid #00ffcc;
            border-radius: 10px;

            transform: scaleX(-1);

            background: #111;

            z-index: 10;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 20px;

            padding: 10px 15px;

            color: #00ffcc;
            background: rgba(0,0,0,0.65);

            border: 1px solid rgba(0,255,204,0.4);
            border-radius: 8px;

            font-size: 14px;

            z-index: 20;
        }

        #error-msg {
            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 90%;
            max-width: 400px;

            padding: 20px;

            color: #ff5555;

            background: rgba(0,0,0,0.9);

            border: 1px solid #ff4444;
            border-radius: 10px;

            text-align: center;

            display: none;

            z-index: 100;
        }
    </style>

    <!-- THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- MEDIAPIPE -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
        crossorigin="anonymous"></script>

</head>

<body>

    <div id="status">
        🔄 Memulai kamera...
    </div>

    <div id="error-msg">
        ⚠️ Kamera tidak dapat digunakan.<br><br>
        Pastikan izin kamera sudah diberikan dan halaman dibuka melalui HTTPS.
    </div>

    <video id="webcam" autoplay playsinline muted></video>


<script>


// ============================================================
// CONFIG
// ============================================================

const PARTICLE_COUNT = 8000;


// ============================================================
// GLOBAL
// ============================================================

let scene;
let camera;
let renderer;

let particles;
let geometry;

let currentPositions =
    new Float32Array(PARTICLE_COUNT * 3);

let targetPositions =
    new Float32Array(PARTICLE_COUNT * 3);

let currentColors =
    new Float32Array(PARTICLE_COUNT * 3);

let targetColors =
    new Float32Array(PARTICLE_COUNT * 3);


// 0 = cloud
// 1 = heart
// 2 = uranus
// 3 = text

let activeShapeIndex = 0;


// ============================================================
// STATUS
// ============================================================

const statusElement =
    document.getElementById("status");

const errorElement =
    document.getElementById("error-msg");

function setStatus(text) {

    statusElement.textContent = text;

}


// ============================================================
// CLOUD
// ============================================================

function getCloudPositions() {

    const pos =
        new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT; i++) {

        pos[i * 3] =
            (Math.random() - 0.5) * 15;

        pos[i * 3 + 1] =
            (Math.random() - 0.5) * 15;

        pos[i * 3 + 2] =
            (Math.random() - 0.5) * 15;

    }

    return pos;

}


// ============================================================
// HEART
// ============================================================

function getHeartPositions() {

    const pos =
        new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT; i++) {

        const t =
            Math.random() * Math.PI * 2;

        const u =
            Math.random() * Math.PI -
            Math.PI / 2;

        const x =
            16 * Math.pow(Math.sin(t), 3);

        const y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        const z = u * 2;

        pos[i * 3] =
            x * 0.3;

        pos[i * 3 + 1] =
            y * 0.3;

        pos[i * 3 + 2] =
            z * 0.3;

    }

    return pos;

}


// ============================================================
// URANUS
// ============================================================

function getUranusPositions() {

    const pos =
        new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT; i++) {

        // PLANET
        if (i < PARTICLE_COUNT * 0.45) {

            const u =
                Math.random() * Math.PI * 2;

            const v =
                Math.random() * Math.PI;

            const r = 2.5;

            pos[i * 3] =
                r * Math.sin(v) * Math.cos(u);

            pos[i * 3 + 1] =
                r * Math.sin(v) * Math.sin(u);

            pos[i * 3 + 2] =
                r * Math.cos(v);

        }

        // RING
        else {

            const theta =
                Math.random() * Math.PI * 2;

            const r =
                3.8 + Math.random() * 2.8;

            pos[i * 3] =
                r * Math.cos(theta);

            pos[i * 3 + 1] =
                (Math.random() - 0.5) * 0.25;

            pos[i * 3 + 2] =
                r * Math.sin(theta);

        }

    }

    return pos;

}


// ============================================================
// TEXT
// ============================================================

function getTextPositions() {

    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext("2d");

    canvas.width = 600;
    canvas.height = 120;

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "white";

    ctx.font =
        "bold 50px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "I LOVE YOU",
        300,
        75
    );

    const imgData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const validPixels = [];


    for (
        let y = 0;
        y < canvas.height;
        y += 2
    ) {

        for (
            let x = 0;
            x < canvas.width;
            x += 2
        ) {

            const index =
                (y * canvas.width + x) * 4;

            if (
                imgData.data[index] > 128
            ) {

                validPixels.push({

                    x:
                        (x - canvas.width / 2)
                        * 0.03,

                    y:
                        -(y - canvas.height / 2)
                        * 0.03

                });

            }

        }

    }


    const pos =
        new Float32Array(PARTICLE_COUNT * 3);


    for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
    ) {

        const pt =
            validPixels[
                i % validPixels.length
            ];


        pos[i * 3] =
            pt.x +
            (Math.random() - 0.5) * 0.03;


        pos[i * 3 + 1] =
            pt.y +
            (Math.random() - 0.5) * 0.03;


        pos[i * 3 + 2] =
            (Math.random() - 0.5) * 0.1;

    }

    return pos;

}


// ============================================================
// COLORS
// ============================================================

function getCloudColors() {

    const col =
        new Float32Array(PARTICLE_COUNT * 3);

    for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
    ) {

        col[i * 3] =
            0.2 + Math.random() * 0.8;

        col[i * 3 + 1] =
            0.2 + Math.random() * 0.8;

        col[i * 3 + 2] =
            0.5 + Math.random() * 0.5;

    }

    return col;

}


function getHeartColors() {

    const col =
        new Float32Array(PARTICLE_COUNT * 3);

    for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
    ) {

        col[i * 3] =
            0.9 + Math.random() * 0.1;

        col[i * 3 + 1] =
            0.05 + Math.random() * 0.15;

        col[i * 3 + 2] =
            0.1 + Math.random() * 0.25;

    }

    return col;

}


function getUranusColors() {

    const col =
        new Float32Array(PARTICLE_COUNT * 3);

    for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
    ) {

        if (
            i < PARTICLE_COUNT * 0.45
        ) {

            col[i * 3] =
                0.35 + Math.random() * 0.15;

            col[i * 3 + 1] =
                0.85 + Math.random() * 0.15;

            col[i * 3 + 2] =
                0.9 + Math.random() * 0.1;

        }

        else {

            col[i * 3] =
                0.25 + Math.random() * 0.15;

            col[i * 3 + 1] =
                0.75 + Math.random() * 0.2;

            col[i * 3 + 2] =
                0.85 + Math.random() * 0.15;

        }

    }

    return col;

}


function getTextColors() {

    const col =
        new Float32Array(PARTICLE_COUNT * 3);

    for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
    ) {

        col[i * 3] = 0.0;

        col[i * 3 + 1] = 1.0;

        col[i * 3 + 2] = 0.8;

    }

    return col;

}


// ============================================================
// CREATE SHAPES
// ============================================================

const shapes = [

    getCloudPositions(),

    getHeartPositions(),

    getUranusPositions(),

    getTextPositions()

];


const shapeColors = [

    getCloudColors(),

    getHeartColors(),

    getUranusColors(),

    getTextColors()

];


// ============================================================
// THREE JS
// ============================================================

function initThreeJS() {

    scene =
        new THREE.Scene();


    camera =
        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /
            window.innerHeight,

            0.1,

            1000

        );


    camera.position.z = 12;


    renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document.body.appendChild(
        renderer.domElement
    );


    geometry =
        new THREE.BufferGeometry();


    const initialPos =
        shapes[0];

    const initialCol =
        shapeColors[0];


    for (
        let i = 0;
        i < PARTICLE_COUNT * 3;
        i++
    ) {

        currentPositions[i] =
            initialPos[i];

        targetPositions[i] =
            initialPos[i];

        currentColors[i] =
            initialCol[i];

        targetColors[i] =
            initialCol[i];

    }


    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            currentPositions,
            3
        )

    );


    geometry.setAttribute(

        "color",

        new THREE.BufferAttribute(
            currentColors,
            3
        )

    );


    const material =
        new THREE.PointsMaterial({

            size: 0.06,

            vertexColors: true,

            blending:
                THREE.AdditiveBlending,

            transparent: true,

            opacity: 0.85,

            depthWrite: false

        });


    particles =
        new THREE.Points(
            geometry,
            material
        );


    scene.add(
        particles
    );


    window.addEventListener(
        "resize",
        onWindowResize
    );


    animate();

}


// ============================================================
// CHANGE SHAPE
// ============================================================

function setShape(shapeIndex) {

    if (
        activeShapeIndex === shapeIndex
    ) {
        return;
    }


    activeShapeIndex =
        shapeIndex;


    const targetPos =
        shapes[shapeIndex];

    const targetCol =
        shapeColors[shapeIndex];


    for (
        let i = 0;
        i < PARTICLE_COUNT * 3;
        i++
    ) {

        targetPositions[i] =
            targetPos[i];

        targetColors[i] =
            targetCol[i];

    }


    const names = [

        "☁️ CLOUD",

        "❤️ HEART",

        "🪐 URANUS",

        "💚 I LOVE YOU"

    ];


    setStatus(
        "✋ Gesture: " +
        names[shapeIndex]
    );

}


// ============================================================
// ANIMATION
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    const positions =
        geometry.attributes
        .position.array;


    const colors =
        geometry.attributes
        .color.array;


    for (
        let i = 0;
        i < PARTICLE_COUNT * 3;
        i++
    ) {

        positions[i] +=
            (
                targetPositions[i]
                - positions[i]
            ) * 0.1;


        colors[i] +=
            (
                targetColors[i]
                - colors[i]
            ) * 0.1;

    }


    geometry.attributes
        .position.needsUpdate = true;


    geometry.attributes
        .color.needsUpdate = true;


    // CLOUD
    if (
        activeShapeIndex === 0
    ) {

        particles.rotation.y +=
            0.005;

    }


    // HEART
    else if (
        activeShapeIndex === 1
    ) {

        particles.rotation.y +=
            0.01;

        particles.rotation.x =
            THREE.MathUtils.lerp(
                particles.rotation.x,
                0,
                0.1
            );

        particles.rotation.z =
            THREE.MathUtils.lerp(
                particles.rotation.z,
                0,
                0.1
            );

    }


    // URANUS
    else if (
        activeShapeIndex === 2
    ) {

        particles.rotation.y +=
            0.012;

        particles.rotation.x +=
            0.008;

        particles.rotation.z +=
            0.003;

    }


    // TEXT
    else if (
        activeShapeIndex === 3
    ) {

        particles.rotation.x =
            THREE.MathUtils.lerp(
                particles.rotation.x,
                0,
                0.1
            );

        particles.rotation.y =
            THREE.MathUtils.lerp(
                particles.rotation.y,
                0,
                0.1
            );

        particles.rotation.z =
            THREE.MathUtils.lerp(
                particles.rotation.z,
                0,
                0.1
            );

    }


    renderer.render(
        scene,
        camera
    );

}


// ============================================================
// RESIZE
// ============================================================

function onWindowResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


// ============================================================
// GESTURE DETECTION
// ============================================================

function detectGesture(landmarks) {

    /*
        Landmark jari:

        Telunjuk:
        8 = ujung
        6 = sendi

        Tengah:
        12 = ujung
        10 = sendi

        Manis:
        16 = ujung
        14 = sendi

        Kelingking:
        20 = ujung
        18 = sendi
    */


    const isIndexOpen =
        landmarks[8].y <
        landmarks[6].y;


    const isMiddleOpen =
        landmarks[12].y <
        landmarks[10].y;


    const isRingOpen =
        landmarks[16].y <
        landmarks[14].y;


    const isPinkyOpen =
        landmarks[20].y <
        landmarks[18].y;


    // ✌️ TWO FINGERS
    if (
        isIndexOpen &&
        isMiddleOpen &&
        !isRingOpen &&
        !isPinkyOpen
    ) {

        return 3;

    }


    // ☝️ ONE FINGER
    if (
        isIndexOpen &&
        !isMiddleOpen &&
        !isRingOpen &&
        !isPinkyOpen
    ) {

        return 2;

    }


    // ✊ FIST
    if (
        !isIndexOpen &&
        !isMiddleOpen &&
        !isRingOpen &&
        !isPinkyOpen
    ) {

        return 1;

    }


    // ✋ OPEN HAND
    if (
        isIndexOpen &&
        isMiddleOpen &&
        isRingOpen &&
        isPinkyOpen
    ) {

        return 0;

    }


    // Tidak dikenali
    return activeShapeIndex;

}


// ============================================================
// MEDIAPIPE RESULTS
// ============================================================

let lastGestureTime = 0;


function onResults(results) {

    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ) {

        const landmarks =
            results.multiHandLandmarks[0];


        const shapeIndex =
            detectGesture(landmarks);


        setShape(shapeIndex);


        // Debug
        console.log(
            "Tangan terdeteksi:",
            shapeIndex
        );

    }

    else {

        setStatus(
            "👋 Tangan tidak terdeteksi"
        );

    }

}


// ============================================================
// CAMERA
// ============================================================

const videoElement =
    document.getElementById(
        "webcam"
    );


async function startCamera() {

    try {

        setStatus(
            "📷 Meminta izin kamera..."
        );


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        width: {
                            ideal: 480
                        },

                        height: {
                            ideal: 360
                        },

                        facingMode:
                            "user"

                    },

                    audio: false

                });


        videoElement.srcObject =
            stream;


        await videoElement.play();


        setStatus(
            "📷 Kamera aktif — mencari tangan..."
        );


        const cameraUtils =
            new Camera(

                videoElement,

                {

                    onFrame:
                        async () => {

                            await hands.send({

                                image:
                                    videoElement

                            });

                        },

                    width: 480,

                    height: 360

                }

            );


        cameraUtils.start();


    }

    catch (error) {

        console.error(
            "KAMERA ERROR:",
            error
        );


        errorElement.style.display =
            "block";


        setStatus(
            "❌ Kamera gagal"
        );

    }

}


// ============================================================
// MEDIAPIPE HANDS
// ============================================================

const hands =
    new Hands({

        locateFile:
            (file) => {

                return (
                    "https://cdn.jsdelivr.net/npm/" +
                    "@mediapipe/hands/" +
                    file
                );

            }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence
